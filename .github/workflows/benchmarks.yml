name: benchmarks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run benchmarks
        run: go test -bench . -benchmem -run '^$' -count=10 -benchtime=200x ./... > bench.txt 2>&1

      - name: Print benchmark numbers
        run: benchstat bench.txt

      - name: Restore baseline
        id: baseline
        uses: actions/cache/restore@v5
        with:
          path: bench-baseline.txt
          key: bench-${{ runner.os }}-${{ github.sha }}
          restore-keys: bench-${{ runner.os }}-

      - name: Print comparison
        if: steps.baseline.outputs.cache-hit == 'true'
        run: benchstat bench-baseline.txt bench.txt

      - name: Check for regressions
        if: steps.baseline.outputs.cache-hit == 'true'
        run: |
          benchstat -format csv bench-baseline.txt bench.txt 2>/dev/null | \
            python3 .github/scripts/check-bench-regression.py

      - name: Save baseline
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v5
        with:
          path: bench.txt
          key: bench-${{ runner.os }}-${{ github.sha }}
