name: benchmarks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Checkout base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: __base

      - name: Run base benchmarks
        if: github.event_name == 'pull_request'
        working-directory: __base
        run: go test -bench . -benchmem -run '^$' -count=10 -benchtime=200x ./... > ../bench-base.txt 2>&1

      - name: Run benchmarks
        run: go test -bench . -benchmem -run '^$' -count=10 -benchtime=200x ./... > bench.txt 2>&1

      - name: Print benchmark numbers
        run: benchstat bench.txt

      - name: Print comparison
        if: github.event_name == 'pull_request'
        run: benchstat bench-base.txt bench.txt

      - name: Check for regressions
        if: github.event_name == 'pull_request'
        run: |
          benchstat -format csv bench-base.txt bench.txt 2>/dev/null | \
            python3 .github/scripts/check-bench-regression.py
